name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VARDAAN_TECH != '' }}
    steps:
      - name: Waiting for the Firebase key secret
        if: env.HAS_KEY != 'true'
        run: echo "Add the FIREBASE_SERVICE_ACCOUNT_VARDAAN_TECH secret in GitHub to enable deploys." && exit 0
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 20
          cache: npm
      - name: Build static site
        if: env.HAS_KEY == 'true'
        run: npm ci && npm run build
      - name: Deploy to Firebase Hosting (live)
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VARDAAN_TECH }}
          projectId: vardaan-tech
          channelId: live
